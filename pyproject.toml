[project]
name = "pinwright"
version = "0.1.0"
description = "Fail-closed auditor for exactly pinned Python dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Henrique" }]

[project.scripts]
pinwright = "pinwright.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
